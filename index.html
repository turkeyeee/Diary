<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>日記 - スプレッドシート・ビューア</title>
<!-- 検索エンジンのインデックス除外(URLを知らない人が検索でヒットしないようにする) -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg: #0b0e13;
    --bg-elevated: #12161d;
    --card: #161b23;
    --card-hover: #1a2029;
    --border: #262d38;
    --border-soft: #1c222b;
    --text: #eae7e1;
    --text-dim: #949eac;
    --text-faint2: #5c6672;
    --accent: #d7a25f;
    --accent-soft: rgba(215, 162, 95, 0.14);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'BIZ UDPGothic', 'Meiryo', 'Hiragino Sans', sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }
  .font-diary { font-family: 'BIZ UDPGothic', 'Meiryo', 'Hiragino Sans', sans-serif; }
  .clamp-4 {
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .clamp-none { -webkit-line-clamp: unset; overflow: visible; }
  ::-webkit-scrollbar { display: none; }
  input[type="text"], input[type="search"] {
    -webkit-appearance: none;
    appearance: none;
  }
  input::-webkit-search-decoration,
  input::-webkit-search-cancel-button {
    -webkit-appearance: none;
    display: none;
  }
</style>
</head>
<body class="min-h-screen">

<!-- ヘッダー -->
<header class="sticky top-0 z-10 border-b" style="background: var(--bg-elevated); border-color: var(--border-soft);">
  <div class="max-w-xl mx-auto px-4 pt-3 pb-3" style="padding-top:calc(0.75rem + env(safe-area-inset-top))">
    <div class="flex items-center justify-between mb-3">
      <h1 class="font-diary text-lg font-bold tracking-wide" style="color: var(--text);">日記</h1>
      <button id="openSettingsBtn" aria-label="設定" class="flex items-center justify-center w-9 h-9 rounded-full border transition-colors" style="border-color: var(--border); color: var(--text-dim);">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>

        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>

      <input
        id="searchInput"

        autocorrect="off"

    <p class="mb-3" style="color: #a9c3ef;">右上の「設定」から接続するスプレッドシートIDとシート名を入力してください。設定内容は端末のブラウザにのみ保存されます。</p>
    <button id="guideSettingsBtn" class="rounded-full text-white text-xs font-semibold px-4 py-2" style="background:#3b82f6;">

  </div>

      <path class="opacity-80" d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
    </svg>
    <p class="text-sm">読み込み中…</p>
  </div>

  <!-- エラー -->

    <div class="rounded-2xl border p-4 text-sm leading-relaxed" style="background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.25); color: #fecaca;">
      <p class="font-bold mb-1" style="color: var(--text);">読み込みに失敗しました</p>
      <p id="errorMessage" class="mb-3"></p>

        <li>設定画面のスプレッドシートID / シート名が正しいか</li>
        <li>通信環境に問題がないか</li>

      <div class="mt-4 flex gap-2">
        <button id="retryButton" class="rounded-full text-white text-xs font-semibold px-4 py-2" style="background:#dc2626;">
          再読み込み

        <button id="errorSettingsBtn" class="rounded-full border text-xs font-semibold px-4 py-2" style="border-color: rgba(248,113,113,0.4); color:#fca5a5;">

  <!-- カレンダー表示 -->

    <div class="flex items-center gap-2 mb-3">

      </button>

    <section class="rounded-2xl p-4 border mb-4" style="background: var(--card); border-color: var(--border);">

    <section class="rounded-2xl p-4 border mb-4" style="background: var(--card); border-color: var(--border);">
      <h3 class="text-xs font-bold tracking-widest mb-3" style="color: var(--text-faint2);">曜日別の記録数</h3>
      <div id="weekdayChart" class="flex flex-col gap-2"></div>
    </section>

    <section class="rounded-2xl p-4 border" style="background: var(--card); border-color: var(--border);">
      <h3 class="text-xs font-bold tracking-widest mb-3" style="color: var(--text-faint2);">よく使うタグ</h3>

<!-- 設定モーダル -->
<div id="settingsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4" style="background: rgba(0,0,0,0.6);">
  <div class="w-full max-w-sm rounded-2xl p-5 shadow-xl border" style="background: var(--card); border-color: var(--border);">
    <h2 class="text-base font-bold mb-3" style="color: var(--text);">スプレッドシート接続設定</h2>
    <div class="space-y-3 text-sm">
      <div>
        <label class="block text-xs font-semibold mb-1" style="color: var(--text-dim);">スプレッドシート ID / またはURL</label>
        <input id="inputSheetId" type="text" placeholder="URLまたは英数字のID" class="w-full rounded-lg px-3 py-2 text-xs border focus:ring-2 outline-none" style="background: var(--bg-elevated); border-color: var(--border); color: var(--text);">
        <p class="text-[10px] mt-0.5" style="color: var(--text-faint2);">※スプレッドシートのURLをそのまま貼っても自動抽出されます</p>
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1" style="color: var(--text-dim);">シートタブ名</label>
        <input id="inputSheetName" type="text" placeholder="diary" value="diary" class="w-full rounded-lg px-3 py-2 text-xs border focus:ring-2 outline-none" style="background: var(--bg-elevated); border-color: var(--border); color: var(--text);">
      </div>
    </div>
    <div class="mt-5 flex justify-end gap-2">
      <button id="cancelSettingsBtn" class="px-4 py-2 rounded-lg text-xs" style="color: var(--text-dim);">キャンセル</button>
      <button id="saveSettingsBtn" class="px-4 py-2 rounded-lg text-xs font-bold" style="background: var(--accent); color: #1a1206;">保存して読み込み</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'ss_viewer_config';

function getConfig() {
  const data = localStorage.getItem(STORAGE_KEY);
  if (!data) return null;
  try {
    return JSON.parse(data);
  } catch (e) {
    return null;
  }
}

function saveConfig(id, sheetName) {
  // URL全体がペーストされた場合、ID部分を正規表現で抽出
  const match = id.match(/\/d\/([a-zA-Z0-9-_]+)/);
  const cleanId = match ? match[1] : id.trim();

  const config = {
    sheetId: cleanId,
    sheetName: (sheetName || 'diary').trim(),
    columns: {
      date: 'date',
      title: 'title',
      content: 'content',
      tags: 'tags',
    }
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
  return config;
}

let allEntries = [];

async function fetchSheetRows(config) {
  const url =
    `https://docs.google.com/spreadsheets/d/${encodeURIComponent(config.sheetId)}/gviz/tq` +
    `?tqx=out:json&headers=1&sheet=${encodeURIComponent(config.sheetName)}`;

  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status} (シートの共有設定またはIDを確認してください)`);

  const text = await res.text();
  const match = text.match(/setResponse\(([\s\S]*)\);?\s*$/);
  if (!match) throw new Error('想定外の応答形式です (シートタブ名が正しいか確認してください)');

  const json = JSON.parse(match[1]);
  if (json.status === 'error') {
    const msg = json.errors?.[0]?.detailed_message || 'シートの読み込みに失敗しました';
    throw new Error(msg);
  }

  const cols = json.table.cols.map((c) => (c.label || '').trim().toLowerCase());
  const headerIndex = resolveHeaderIndex(cols, config.columns);

  return (json.table.rows || []).map((row) => buildEntry(headerIndex, row));
}

// 列名の表記ゆれ(日本語ヘッダーなど)を吸収するためのエイリアス
const HEADER_ALIASES = {
  date: ['日付', '日時', '年月日'],
  title: ['タイトル', '件名', '題名'],
  content: ['本文', '内容', 'メモ', '日記'],
  tags: ['タグ', 'カテゴリ', 'カテゴリー'],
};

function resolveHeaderIndex(cols, columnsConfig) {
  const headerIndex = {};
  for (const [key, label] of Object.entries(columnsConfig)) {
    const candidates = [label, ...(HEADER_ALIASES[key] || [])].map((s) => s.trim().toLowerCase());
    const idx = cols.findIndex((c) => candidates.includes(c));
    if (idx !== -1) headerIndex[key] = idx;
  }

  // ヘッダー名が一つも一致しない場合は、列の並び順(左から date, title, content, tags)とみなす
  if (Object.keys(headerIndex).length === 0) {
    const order = ['date', 'title', 'content', 'tags'];
    order.forEach((key, idx) => {
      if (idx < cols.length) headerIndex[key] = idx;
    });
  }

  return headerIndex;
}

function cellText(cell) {
  if (!cell) return '';
  return cell.f ?? (cell.v != null ? String(cell.v) : '');
}

function cellDate(cell) {
  if (!cell) return null;
  const raw = cell.v;
  if (typeof raw === 'string') {
    const m = raw.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/);
    if (m) {
      const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
      const h = m[4] ? Number(m[4]) : 0;
      const mi = m[5] ? Number(m[5]) : 0;
      const s = m[6] ? Number(m[6]) : 0;
      return new Date(y, mo, d, h, mi, s);
    }
  }
  const parsed = new Date(cell.f ?? raw);
  return isNaN(parsed.getTime()) ? null : parsed;
}

function buildEntry(headerIndex, row) {
  const cell = (key) => (headerIndex[key] != null ? row.c[headerIndex[key]] : null);
  const dateCell = cell('date');
  return {
    dateObj: cellDate(dateCell),
    dateText: cellText(dateCell),
    title: cellText(cell('title')),
    content: cellText(cell('content')),
    tags: cellText(cell('tags')).split(',').map((t) => t.trim()).filter(Boolean),
  };
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

function formatDateLabel(entry) {
  if (entry.dateObj) {
    return `${entry.dateObj.getDate()}日 (${WEEKDAYS[entry.dateObj.getDay()]})`;
  }
  return entry.dateText || '日付なし';
}

function monthKey(entry) {
  if (entry.dateObj) {
    return `${entry.dateObj.getFullYear()}-${String(entry.dateObj.getMonth() + 1).padStart(2, '0')}`;
  }
  return 'その他';
}

function monthLabel(key, entry) {
  if (entry.dateObj) {
    return `${entry.dateObj.getFullYear()}年 ${entry.dateObj.getMonth() + 1}月`;
  }
  return '日付未設定';
}

function groupByMonth(entries) {
  const groups = [];
  let current = null;
  for (const e of entries) {
    const key = monthKey(e);
    if (!current || current.key !== key) {
      current = { key, label: monthLabel(key, e), items: [] };
      groups.push(current);
    }
    current.items.push(e);
  }
  return groups;
}

function entryCardHTML(e, tagFilterHandler) {
  return `
    <article class="rounded-2xl p-4 border transition-colors" style="background: var(--card); border-color: var(--border);">
      <time class="text-xs font-semibold tracking-wide" style="color: var(--accent);">${escapeHTML(formatDateLabel(e))}</time>
      ${e.title ? `<h2 class="font-diary text-[16px] font-bold mt-1 mb-1.5 leading-snug" style="color: var(--text);">${escapeHTML(e.title)}</h2>` : '<div class="mt-1"></div>'}
      <p class="entry-content clamp-4 font-diary text-[15px] leading-[1.85] whitespace-pre-wrap cursor-pointer" data-toggle style="color: var(--text-dim);">${escapeHTML(e.content)}</p>
      <button class="hidden mt-1.5 text-xs font-semibold" data-toggle-btn style="color: var(--accent);">続きを読む</button>
      ${e.tags.length ? `
        <div class="flex flex-wrap gap-1.5 mt-3">
          ${e.tags.map((t) => `<button class="text-[11px] rounded-full px-2.5 py-1 tag-btn" data-tag="${escapeHTML(t)}" style="background: var(--accent-soft); color: var(--accent);">#${escapeHTML(t)}</button>`).join('')}
        </div>` : ''}
    </article>
  `;
}

function renderCards(entries) {
  const list = document.getElementById('cardList');
  const empty = document.getElementById('emptyState');

  if (!entries.length) {
    list.innerHTML = '';
    empty.textContent = allEntries.length ? '一致する記録がありません' : 'データがありません';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  const groups = groupByMonth(entries);

  list.innerHTML = groups.map((g) => `
    <section>
      <h3 class="text-xs font-bold tracking-widest mb-2 px-1" style="color: var(--text-faint2);">${escapeHTML(g.label)}</h3>
      <div class="flex flex-col gap-3">
        ${g.items.map((e) => entryCardHTML(e)).join('')}
      </div>
    </section>
  `).join('');

  // クランプされた本文にのみ「続きを読む」を表示する
  list.querySelectorAll('.entry-content').forEach((p) => {
    const btn = p.parentElement.querySelector('[data-toggle-btn]');
    const isTruncated = p.scrollHeight > p.clientHeight + 1;
    if (isTruncated) btn.classList.remove('hidden');

    const toggle = () => {
      const expanded = p.classList.toggle('clamp-none');
      btn.textContent = expanded ? '閉じる' : '続きを読む';
      if (!expanded && !isTruncated) btn.classList.add('hidden');
    };
    p.addEventListener('click', toggle);
    btn.addEventListener('click', toggle);
  });

  // タグをタップして検索欄に反映
  list.querySelectorAll('.tag-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const searchInput = document.getElementById('searchInput');
      searchInput.value = btn.dataset.tag;
      applySearch();
      searchInput.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

/* カレンダー表示 */
let currentView = 'list';
let calendarViewDate = new Date();
let selectedDate = new Date();

function ymd(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function parseYMD(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function getEntriesByDate() {
  const map = new Map();
  for (const e of allEntries) {
    if (!e.dateObj) continue;
    const key = ymd(e.dateObj);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(e);
  }
  return map;
}

function setActiveView(view) {
  currentView = view;
  document.querySelectorAll('.view-tab-btn').forEach((btn) => {
    const active = btn.dataset.view === view;
    btn.style.background = active ? 'var(--accent)' : 'transparent';
    btn.style.color = active ? '#1a1206' : 'var(--text-dim)';
  });
  document.getElementById('listView').classList.toggle('hidden', view !== 'list');
  document.getElementById('calendarView').classList.toggle('hidden', view !== 'calendar');
  document.getElementById('analysisView').classList.toggle('hidden', view !== 'analysis');
  if (view === 'calendar') renderCalendar();
  if (view === 'analysis') renderAnalysis();
}

function buildCalendarCells(year, month) {
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const cells = [];

  for (let i = startWeekday - 1; i >= 0; i--) {
    cells.push({ date: new Date(year, month - 1, daysInPrevMonth - i), current: false });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ date: new Date(year, month, d), current: true });
  }
  let nextDay = 1;
  while (cells.length % 7 !== 0) {
    cells.push({ date: new Date(year, month + 1, nextDay++), current: false });
  }
  return cells;
}

function renderCalendar() {
  const year = calendarViewDate.getFullYear();
  const month = calendarViewDate.getMonth();
  document.getElementById('calMonthLabel').textContent = `${year}年${month + 1}月`;

  const weekdaysEl = document.getElementById('calWeekdays');
  weekdaysEl.innerHTML = WEEKDAYS.map((w, i) => {
    const color = i === 0 ? '#f87171' : i === 6 ? '#60a5fa' : 'var(--text-faint2)';
    return `<div style="color: ${color};">${w}</div>`;
  }).join('');

  const entriesByDate = getEntriesByDate();
  const today = new Date();
  const cells = buildCalendarCells(year, month);

  const gridEl = document.getElementById('calGrid');
  gridEl.innerHTML = cells.map(({ date, current }) => {
    const key = ymd(date);
    const hasEntries = entriesByDate.has(key);
    const isSelected = isSameDay(date, selectedDate);
    const isToday = isSameDay(date, today);
    const weekday = date.getDay();
    let color = current ? 'var(--text)' : 'var(--text-faint2)';
    if (current && weekday === 0) color = '#f87171';
    if (current && weekday === 6) color = '#60a5fa';
    const border = isSelected ? `border: 1.5px solid var(--accent);` : 'border: 1.5px solid transparent;';
    const bg = isToday && !isSelected ? 'background: var(--accent-soft);' : '';
    const opacity = current ? '1' : '0.35';
    return `
      <button class="cal-day-btn flex flex-col items-center justify-center gap-0.5 rounded-xl aspect-square" data-date="${key}" ${current ? '' : 'disabled'}
        style="${border} ${bg} color: ${color}; opacity: ${opacity};">
        <span class="text-[13px] font-semibold">${date.getDate()}</span>
        <span class="w-1 h-1 rounded-full" style="background: ${hasEntries ? 'var(--accent)' : 'transparent'};"></span>
      </button>
    `;
  }).join('');

  gridEl.querySelectorAll('.cal-day-btn:not([disabled])').forEach((btn) => {
    btn.addEventListener('click', () => {
      const [y, m, d] = btn.dataset.date.split('-').map(Number);
      selectedDate = new Date(y, m - 1, d);
      renderCalendar();
    });
  });

  renderSelectedDateEntries(entriesByDate);
}

function renderSelectedDateEntries(entriesByDate) {
  const label = `${selectedDate.getFullYear()}年${selectedDate.getMonth() + 1}月${selectedDate.getDate()}日 (${WEEKDAYS[selectedDate.getDay()]})`;
  document.getElementById('calSelectedLabel').textContent = label;

  const entries = entriesByDate.get(ymd(selectedDate)) || [];
  const container = document.getElementById('calSelectedEntries');
  if (!entries.length) {
    container.innerHTML = `<p class="text-sm text-center py-10" style="color: var(--text-faint2);">該当日の日記はまだありません。</p>`;
    return;
  }
  container.innerHTML = entries.map((e) => entryCardHTML(e)).join('');

  container.querySelectorAll('.entry-content').forEach((p) => {
    const btn = p.parentElement.querySelector('[data-toggle-btn]');
    const isTruncated = p.scrollHeight > p.clientHeight + 1;
    if (isTruncated) btn.classList.remove('hidden');
    const toggle = () => {
      const expanded = p.classList.toggle('clamp-none');
      btn.textContent = expanded ? '閉じる' : '続きを読む';
      if (!expanded && !isTruncated) btn.classList.add('hidden');
    };
    p.addEventListener('click', toggle);
    btn.addEventListener('click', toggle);
  });
}

/* 分析表示 */
function computeStreaks(entriesByDate) {
  const keys = Array.from(entriesByDate.keys()).sort();
  if (!keys.length) return { current: 0, longest: 0 };

  let longest = 1;
  let run = 1;
  for (let i = 1; i < keys.length; i++) {
    const diffDays = Math.round((parseYMD(keys[i]) - parseYMD(keys[i - 1])) / 86400000);
    run = diffDays === 1 ? run + 1 : 1;
    longest = Math.max(longest, run);
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const cursor = entriesByDate.has(ymd(today)) ? today : new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);
  let current = 0;
  while (entriesByDate.has(ymd(cursor))) {
    current++;
    cursor.setDate(cursor.getDate() - 1);
  }

  return { current, longest };
}

function statTileHTML(label, value) {
  return `
    <div class="rounded-2xl p-4 border" style="background: var(--card); border-color: var(--border);">
      <div class="text-2xl font-bold" style="color: var(--accent);">${value}</div>
      <div class="text-xs mt-1" style="color: var(--text-faint2);">${label}</div>
    </div>
  `;
}

function renderMonthlyChart() {
  const counts = new Map();
  for (const e of allEntries) {
    if (!e.dateObj) continue;
    const key = `${e.dateObj.getFullYear()}-${String(e.dateObj.getMonth() + 1).padStart(2, '0')}`;
    counts.set(key, (counts.get(key) || 0) + 1);
  }
  const months = Array.from(counts.keys()).sort().slice(-12);
  const container = document.getElementById('monthlyChart');

  if (!months.length) {
    container.innerHTML = `<p class="text-sm w-full text-center py-6" style="color: var(--text-faint2);">データがありません</p>`;
    return;
  }

  const max = Math.max(1, ...months.map((k) => counts.get(k)));
  container.innerHTML = months.map((key) => {
    const [, m] = key.split('-');
    const count = counts.get(key);
    const heightPct = Math.max(Math.round((count / max) * 100), 4);
    return `
      <div class="flex flex-col items-center" style="flex: 1 1 0; min-width: 0;">
        <span class="text-[10px] font-bold mb-1" style="color: var(--text-dim);">${count}</span>
        <div class="w-full flex flex-col justify-end" style="height: 96px;">
          <div class="w-full rounded-t-md" style="height: ${heightPct}%; background: var(--accent);"></div>
        </div>
        <span class="text-[10px] mt-1" style="color: var(--text-faint2);">${Number(m)}月</span>
      </div>
    `;
  }).join('');
}

function renderWeekdayChart(entriesByDate) {
  const counts = new Array(7).fill(0);
  for (const [key, entries] of entriesByDate) {
    counts[parseYMD(key).getDay()] += entries.length;
  }
  const max = Math.max(1, ...counts);
  const container = document.getElementById('weekdayChart');
  container.innerHTML = WEEKDAYS.map((w, i) => {
    const pct = Math.max(Math.round((counts[i] / max) * 100), counts[i] > 0 ? 3 : 0);
    const labelColor = i === 0 ? '#f87171' : i === 6 ? '#60a5fa' : 'var(--text-dim)';
    return `
      <div class="flex items-center gap-2">
        <span class="w-4 text-xs font-bold text-center shrink-0" style="color: ${labelColor};">${w}</span>
        <div class="flex-1 rounded-full overflow-hidden" style="background: var(--bg-elevated); height: 10px;">
          <div style="width: ${pct}%; height: 100%; background: var(--accent); border-radius: 9999px;"></div>
        </div>
        <span class="w-6 text-right text-xs font-semibold shrink-0" style="color: var(--text-dim);">${counts[i]}</span>
      </div>
    `;
  }).join('');
}

function renderTagRanking() {
  const counts = new Map();
  for (const e of allEntries) {
    for (const t of e.tags) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const ranked = Array.from(counts.entries()).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const container = document.getElementById('tagRanking');

  if (!ranked.length) {
    container.innerHTML = `<p class="text-sm text-center py-4" style="color: var(--text-faint2);">タグが登録されている記録がありません</p>`;
    return;
  }

  const max = ranked[0][1];
  container.innerHTML = ranked.map(([tag, count]) => {
    const pct = Math.max(Math.round((count / max) * 100), 3);
    return `
      <div class="flex items-center gap-2">
        <span class="text-xs shrink-0 truncate" style="max-width: 40%; color: var(--text);">#${escapeHTML(tag)}</span>
        <div class="flex-1 rounded-full overflow-hidden" style="background: var(--bg-elevated); height: 10px;">
          <div style="width: ${pct}%; height: 100%; background: var(--accent); border-radius: 9999px;"></div>
        </div>
        <span class="w-6 text-right text-xs font-semibold shrink-0" style="color: var(--text-dim);">${count}</span>
      </div>
    `;
  }).join('');
}

function renderAnalysis() {
  const entriesByDate = getEntriesByDate();
  const { current, longest } = computeStreaks(entriesByDate);

  document.getElementById('statTiles').innerHTML = [
    statTileHTML('総記録数', `${allEntries.length}件`),
    statTileHTML('記録日数', `${entriesByDate.size}日`),
    statTileHTML('連続記録中', `${current}日`),
    statTileHTML('最長連続記録', `${longest}日`),
  ].join('');

  renderMonthlyChart();
  renderWeekdayChart(entriesByDate);
  renderTagRanking();
}

function applySearch() {
  const searchInput = document.getElementById('searchInput');
  const q = searchInput.value.trim().toLowerCase();
  document.getElementById('clearSearchBtn').classList.toggle('hidden', !q);
  document.getElementById('clearSearchBtn').classList.toggle('flex', !!q);
  if (!q) return renderCards(allEntries);
  const terms = q.split(/\s+/).filter(Boolean);
  const filtered = allEntries.filter((e) => {
    const hay = `${e.title}\n${e.content}\n${e.tags.join(' ')}`.toLowerCase();
    return terms.every((t) => hay.includes(t));
  });
  renderCards(filtered);
}

/* モーダル操作 */
const modal = document.getElementById('settingsModal');
function showModal() {
  const config = getConfig();
  if (config) {
    document.getElementById('inputSheetId').value = config.sheetId || '';
    document.getElementById('inputSheetName').value = config.sheetName || 'diary';
  }
  modal.classList.remove('hidden');
}
function hideModal() {
  modal.classList.add('hidden');
}

/* 読み込み処理 */
async function load() {
  const config = getConfig();
  if (!config || !config.sheetId) {
    document.getElementById('setupNotice').classList.remove('hidden');
    document.getElementById('loadingState').classList.add('hidden');
    return;
  }
  document.getElementById('setupNotice').classList.add('hidden');
  document.getElementById('loadingState').classList.remove('hidden');
  document.getElementById('errorState').classList.add('hidden');
  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('cardList').innerHTML = '';

  try {
    const rows = await fetchSheetRows(config);
    rows.sort((a, b) => {
      if (a.dateObj && b.dateObj) return b.dateObj - a.dateObj;
      return String(b.dateText).localeCompare(String(a.dateText));
    });
    allEntries = rows;
    document.getElementById('loadingState').classList.add('hidden');
    applySearch();
    renderCalendar();
    renderAnalysis();
  } catch (err) {
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('errorMessage').textContent = err.message;
    document.getElementById('errorState').classList.remove('hidden');
  }
}

// イベントリスナー
document.getElementById('searchInput').addEventListener('input', applySearch);
document.getElementById('clearSearchBtn').addEventListener('click', () => {
  const searchInput = document.getElementById('searchInput');
  searchInput.value = '';
  applySearch();
  searchInput.focus();
});
document.getElementById('retryButton').addEventListener('click', load);
document.getElementById('openSettingsBtn').addEventListener('click', showModal);
document.getElementById('guideSettingsBtn').addEventListener('click', showModal);
document.getElementById('errorSettingsBtn').addEventListener('click', showModal);
document.getElementById('cancelSettingsBtn').addEventListener('click', hideModal);

document.querySelectorAll('.view-tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => setActiveView(btn.dataset.view));
});
document.getElementById('calPrevBtn').addEventListener('click', () => {
  calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth() - 1, 1);
  renderCalendar();
});
document.getElementById('calNextBtn').addEventListener('click', () => {
  calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth() + 1, 1);
  renderCalendar();
});
document.getElementById('calTodayBtn').addEventListener('click', () => {
  const today = new Date();
  calendarViewDate = new Date(today.getFullYear(), today.getMonth(), 1);
  selectedDate = today;
  renderCalendar();
});

/* 左右スワイプでリスト/カレンダーを切り替え */
(() => {
  const VIEWS = ['list', 'calendar', 'analysis'];
  const mainContent = document.getElementById('mainContent');
  let touchStartX = 0;
  let touchStartY = 0;

  mainContent.addEventListener('touchstart', (ev) => {
    if (ev.touches.length !== 1) return;
    touchStartX = ev.touches[0].clientX;
    touchStartY = ev.touches[0].clientY;
  }, { passive: true });

  mainContent.addEventListener('touchend', (ev) => {
    const touch = ev.changedTouches[0];
    const deltaX = touch.clientX - touchStartX;
    const deltaY = touch.clientY - touchStartY;
    const SWIPE_THRESHOLD = 60;

    if (Math.abs(deltaX) < SWIPE_THRESHOLD || Math.abs(deltaX) < Math.abs(deltaY) * 1.5) return;

    const currentIndex = VIEWS.indexOf(currentView);
    const nextIndex = deltaX < 0 ? currentIndex + 1 : currentIndex - 1;
    if (nextIndex >= 0 && nextIndex < VIEWS.length) {
      setActiveView(VIEWS[nextIndex]);
    }
  }, { passive: true });
})();

setActiveView('list');

document.getElementById('saveSettingsBtn').addEventListener('click', () => {
  const idVal = document.getElementById('inputSheetId').value;
  const nameVal = document.getElementById('inputSheetName').value;
  if (!idVal.trim()) {
    alert('スプレッドシートIDを入力してください');
    return;
  }
  saveConfig(idVal, nameVal);
  hideModal();
  load();
});

// 初期実行
load();
</script>
